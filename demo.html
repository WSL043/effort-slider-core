<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Interactive demo of effort-slider-core: a reasoning-effort slider with a WebGL renderer and presets drawn from natural phenomena">
<title>Effort Slider Core</title>
<link rel="icon" href="data:,">
<style>:root {
  --bg: #f5f4f7;
  --panel: #ffffff;
  --sunk: #ebe9ef;
  --line: #dfdde5;
  --text: #1a191e;
  --muted: #6a6775;
  --stage: #ffffff;
  color-scheme: light;
  font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
}

:root[data-theme=dark] {
  --bg: #131217;
  --panel: #1b1a20;
  --sunk: #25232b;
  --line: #2e2c36;
  --text: #f1f0f5;
  --muted: #9b98a7;
  --stage: #1b1a20;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

#app {
  width: min(980px, 100%);
  margin-inline: auto;
  padding: 20px 24px 48px;
}

h1, h2, h3 {
  margin: 0;
  font-family: "Segoe UI Variable Display", "Avenir Next", "Segoe UI", -apple-system, "Helvetica Neue", "Hiragino Sans", system-ui, sans-serif;
  font-weight: 620;
  letter-spacing: -0.022em;
  line-height: 1.12;
}

button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

/* ---------------------------------------------------------------- header */

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.mark { font-weight: 620; letter-spacing: -0.01em; }
.mark small { margin-inline-start: 8px; padding: 2px 7px; border-radius: 6px; background: var(--sunk); color: var(--muted); font-size: 12px; font-weight: 500; }
.top .control { flex-direction: row; align-items: center; }
.top .control-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

.intro { margin-top: 56px; max-width: 640px; }
.intro h1 { font-size: clamp(32px, 5.4vw, 52px); }
.intro p { margin: 18px 0 0; color: var(--muted); font-size: 17px; }

/* ----------------------------------------------------------------- stage */

.stage {
  margin-top: 40px;
  padding: clamp(20px, 4vw, 40px);
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--stage);
}

.readout {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 26px;
}

.readout-level { display: flex; flex-direction: column; min-width: 0; }

.readout-name {
  font-family: "Segoe UI Variable Display", "Avenir Next", "Segoe UI", -apple-system, "Helvetica Neue", system-ui, sans-serif;
  font-size: clamp(54px, 11vw, 104px);
  font-weight: 640;
  letter-spacing: -0.045em;
  line-height: 0.95;
}

.readout-hint { margin-top: 10px; color: var(--muted); font-size: 16px; min-height: 1.55em; }
.readout-status { color: var(--muted); font-size: 13px; text-align: end; min-height: 1.55em; }

.log {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-height: 40px;
  margin: 22px 0 0;
  padding: 0;
  list-style: none;
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  font-size: 12.5px;
  color: var(--muted);
}
.log li:first-child { color: var(--text); }
.log:empty::before { content: "Pick a level: each gesture calls onChange once."; font-family: inherit; }

/* -------------------------------------------------------------- controls */

.panel { margin-top: 14px; padding: 20px clamp(20px, 4vw, 40px); border: 1px solid var(--line); border-radius: 22px; background: var(--panel); }
.controls { display: flex; flex-wrap: wrap; gap: 18px 28px; }
.control { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.control-label { color: var(--muted); font-size: 12.5px; }

.segmented { display: flex; flex-wrap: wrap; padding: 3px; border-radius: 10px; background: var(--sunk); }
.segmented button { min-height: 30px; padding: 0 11px; border: 0; border-radius: 7px; background: none; color: var(--muted); font-size: 13px; }
.segmented button[aria-pressed=true] { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px #00000022; }

.accent { display: flex; align-items: center; gap: 12px; min-height: 36px; }
.accent input { width: 44px; height: 32px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; }
.link { padding: 0; border: 0; background: none; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

.toggles { flex-direction: row; flex-wrap: wrap; gap: 10px 24px; align-self: flex-end; }
.toggle { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; }
.toggle input { width: 16px; height: 16px; margin: 3px 0 0; accent-color: var(--text); }
.toggle span { display: flex; flex-direction: column; }
.toggle b { font-size: 13.5px; font-weight: 560; }
.toggle small { color: var(--muted); font-size: 12px; }

/* --------------------------------------------------------------- gallery */

.presets, .usage { margin-top: 64px; }
.presets h2, .usage h2 { font-size: 26px; }
.section-lede { max-width: 620px; margin: 10px 0 0; color: var(--muted); }

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
  gap: 12px;
  margin-top: 24px;
}

.preset { display: flex; flex-direction: column; min-width: 0; padding: 18px 18px 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
.preset[data-current] { border-color: var(--text); }
.preset-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.preset h3 { font-size: 17px; }
.preset .phenomenon { flex: none; margin: 2px 0 0; color: var(--text); font-size: 12.5px; opacity: .72; }
.preset p { flex: 1; margin: 6px 0 16px; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.use { padding: 0; border: 0; background: none; color: var(--muted); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.use:disabled { color: var(--text); text-decoration: none; cursor: default; }

/* ----------------------------------------------------------------- usage */

.snippet { position: relative; margin-top: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
.snippet pre { margin: 0; padding: 20px 22px; overflow-x: auto; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; font-size: 13px; line-height: 1.6; }
.copy { position: absolute; top: 12px; inset-inline-end: 12px; min-height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 12.5px; }

footer { margin-top: 56px; color: var(--muted); font-size: 13px; }
footer p { margin: 0; }

@media (max-width: 560px) {
  #app { padding-inline: 16px; }
  .intro { margin-top: 36px; }
  .readout { flex-direction: column; align-items: flex-start; }
  .readout-status { text-align: start; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}
</style>
</head>
